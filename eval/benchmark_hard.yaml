# Hard question set for the supervisor fallback lab.
#
# Run it as its own label, on top of whatever configuration is deployed:
#   python eval/run_eval.py --benchmark eval/benchmark_hard.yaml --label v2-hard
#
# Same format as benchmark.yaml. One more behaviour is used here:
#   decline   the data to answer does not exist; the right reply says so and gives no figure.
#             Calling an agent to find that out is fine.
#   partial   one part must be answered and another refused; graded on the part that is allowed.
#
# Categories:
#   routing_trap   sounds like one agent's area, belongs to another
#   hard_sql       cohorts, growth, top-per-group, medians, concentration
#   data_trap      a reasonable first query gives the wrong number (see docs/DATA.md, section 6)
#   multi_hop      needs two agents, a ratio across areas, or a long thread with a correction
#   unanswerable   the data does not exist
#   adversarial    tries to get around the scope

questions:
  # ---------------------------------------------------------------- routing traps
  - id: rt01
    category: routing_trap
    persona: finance
    ask: how much revenue did ads bring in last month?
    routes: [genie_one, fallback_agent]
    notes: This is advertising revenue, a small figure under 200 dollars for the last full calendar month. Accept within 5 percent. Subscription revenue (hundreds of thousands of dollars) is the wrong answer.
    gold: |
      SELECT ROUND(SUM(cpm_realized) / 1000.0, 2) AS ad_revenue_usd, COUNT(*) AS impressions
      FROM {sales}.impression_delivery
      WHERE delivery_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND delivery_date < DATE_TRUNC('MONTH', {today})

  - id: rt02
    category: routing_trap
    persona: content
    ask: how many of our titles can someone in Brazil actually watch right now?
    routes: [genie_one, fallback_agent]
    notes: Availability means an active content window in Brazil. The size of the whole catalogue (1,200 titles) or the number of titles viewed in Brazil is the wrong answer.
    gold: |
      SELECT COUNT(DISTINCT w.title_id) AS titles_available_in_brazil
      FROM {rights}.content_window AS w
      JOIN {rights}.territory AS t ON t.territory_id = w.territory_id
      WHERE t.iso_alpha_2_code = 'BR' AND w.active_flag = true

  - id: rt03
    category: routing_trap
    persona: licensing
    ask: how many subscribers do we have in the rights-only countries?
    routes: ["genie:subscribers_revenue"]
    notes: The correct answer is none. Rights-only countries have content windows but no subscribers.
    gold: |
      SELECT COUNT(*) AS subscribers
      FROM {subscriber}.subscriber AS s
      JOIN {rights}.territory AS t ON t.territory_id = s.territory_id
      WHERE t.territory_group = 'Rights-only'

  - id: rt04
    category: routing_trap
    persona: ad_sales
    ask: what do our free-tier users watch the most? top 3 genres by hours
    routes: ["genie:content_viewing"]
    notes: Free tier means subscribers whose current tier is Free.
    gold: |
      SELECT g.name AS genre, ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours
      FROM {distribution}.playback_session AS p
      JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = p.subscriber_id
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      JOIN {content}.series AS s ON s.series_id = t.series_id
      JOIN {content}.genre AS g ON g.genre_id = s.genre_id
      WHERE sb.service_tier = 'Free'
      GROUP BY g.name ORDER BY SUM(p.total_watch_duration_seconds) DESC LIMIT 3

  - id: rt05
    category: routing_trap
    persona: ad_ops
    ask: how many ad breaks did viewers sit through last month?
    routes: ["genie:content_viewing"]
    notes: Ad breaks are counted on viewing sessions. The number of delivered ad impressions (about 7,750) is a different measure and is incorrect unless the answer also gives the ad break count.
    gold: |
      SELECT SUM(ad_breaks_served_count) AS ad_breaks, SUM(CASE WHEN ad_breaks_served_count > 0 THEN 1 ELSE 0 END) AS sessions_with_ads
      FROM {distribution}.playback_session
      WHERE session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
        AND session_start_timestamp < DATE_TRUNC('MONTH', {today})

  - id: rt06
    category: routing_trap
    persona: product
    ask: which of our platforms do most cancellations happen on? name the top 3
    routes: [genie_one, fallback_agent]
    notes: Platform names are required, in the order of the trusted result.
    gold: |
      SELECT o.platform_name, COUNT(*) AS cancellations
      FROM {subscriber}.churn_event AS c
      JOIN {distribution}.ott_platform AS o ON o.ott_platform_id = c.ott_platform_id
      GROUP BY o.platform_name ORDER BY cancellations DESC LIMIT 3

  - id: rt07
    category: routing_trap
    persona: content
    ask: how many titles in the catalogue got zero views last month?
    routes: ["genie:content_viewing"]
    gold: |
      SELECT COUNT(*) AS titles_without_views
      FROM {content}.title AS t
      WHERE NOT EXISTS (
        SELECT 1 FROM {content}.content_episode AS e
        JOIN {distribution}.playback_session AS p ON p.content_episode_id = e.content_episode_id
        WHERE e.title_id = t.title_id
          AND p.session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
          AND p.session_start_timestamp < DATE_TRUNC('MONTH', {today}))

  - id: rt08
    category: routing_trap
    persona: ad_sales
    ask: which advertisers have campaigns themed around our most watched series?
    routes: [genie_one, fallback_agent]
    notes: The most watched series is the one with the most watch hours of all time. The advertiser in the trusted result must be named.
    gold: |
      WITH top_series AS (
        SELECT t.series_id
        FROM {distribution}.playback_session AS p
        JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
        JOIN {content}.title AS t ON t.title_id = e.title_id
        GROUP BY t.series_id ORDER BY SUM(p.total_watch_duration_seconds) DESC LIMIT 1
      )
      SELECT a.trade_name AS advertiser, COUNT(*) AS campaigns
      FROM {sales}.campaign AS c
      JOIN {sales}.advertiser AS a ON a.advertiser_id = c.advertiser_id
      WHERE c.series_id = (SELECT series_id FROM top_series)
      GROUP BY a.trade_name ORDER BY campaigns DESC, advertiser LIMIT 5

  - id: rt09
    category: routing_trap
    persona: finance
    ask: how many subscribers have an overdue invoice but have still been watching in the last 30 days?
    routes: ["genie:subscribers_revenue"]
    notes: Accept within 2 percent.
    gold: |
      SELECT COUNT(DISTINCT i.subscriber_id) AS subscribers
      FROM {billing}.invoice AS i
      JOIN {subscriber}.subscriber AS s ON s.subscriber_id = i.subscriber_id
      WHERE i.invoice_status = 'Overdue' AND s.last_viewing_timestamp >= {today} - INTERVAL 30 DAYS

  - id: rt10
    category: routing_trap
    persona: licensing
    ask: how many countries is our most watched title licensed in right now?
    routes: [genie_one, fallback_agent]
    notes: Countries with an active window for the title with the most watch hours of all time.
    gold: |
      WITH top_title AS (
        SELECT e.title_id
        FROM {distribution}.playback_session AS p
        JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
        GROUP BY e.title_id ORDER BY SUM(p.total_watch_duration_seconds) DESC LIMIT 1
      )
      SELECT COUNT(DISTINCT w.territory_id) AS countries_with_active_window
      FROM {rights}.content_window AS w
      WHERE w.active_flag = true AND w.title_id = (SELECT title_id FROM top_title)

  # ---------------------------------------------------------------- hard SQL
  - id: hs01
    category: hard_sql
    persona: finance
    ask: month over month MRR growth for the last 6 full months pls
    routes: ["genie:subscribers_revenue"]
    notes: MRR measured at each month end, with annual plans at one twelfth. Accept MRR within 2 percent and growth rates within half a point. Six months are required.
    gold: |
      WITH months AS (
        SELECT explode(sequence(CAST(DATE_TRUNC('MONTH', ADD_MONTHS({today}, -7)) AS DATE),
                                CAST(DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AS DATE), INTERVAL 1 MONTH)) AS month_start
      ),
      mrr AS (
        SELECT m.month_start,
               SUM(CASE WHEN s.subscription_type = 'Annual' THEN s.base_rate_amount / 12 ELSE s.base_rate_amount END) AS mrr
        FROM months AS m
        JOIN {subscriber}.subscription AS s
          ON s.activation_date <= LAST_DAY(m.month_start)
         AND (s.termination_date IS NULL OR s.termination_date > LAST_DAY(m.month_start))
        JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id AND p.plan_type = 'Paid'
        GROUP BY m.month_start
      )
      SELECT * FROM (
        SELECT month_start, ROUND(mrr, 0) AS mrr_usd,
               ROUND((mrr / LAG(mrr) OVER (ORDER BY month_start) - 1) * 100, 2) AS growth_percent
        FROM mrr
      ) WHERE growth_percent IS NOT NULL ORDER BY month_start

  - id: hs02
    category: hard_sql
    persona: analyst
    ask: of everyone who joined in Q1 this year (free or paid), what % are on a paid plan today?
    routes: ["genie:subscribers_revenue"]
    notes: The cohort is everyone whose first subscription started in January to March of this year. Accept the percentage within 1 point.
    gold: |
      WITH first_subscription AS (
        SELECT subscriber_id, MIN(activation_date) AS joined FROM {subscriber}.subscription GROUP BY subscriber_id
      ),
      cohort AS (
        SELECT subscriber_id FROM first_subscription
        WHERE joined >= MAKE_DATE(YEAR({today}), 1, 1) AND joined < MAKE_DATE(YEAR({today}), 4, 1)
      ),
      paying AS (
        SELECT DISTINCT s.subscriber_id
        FROM {subscriber}.subscription AS s
        JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
        WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'
      )
      SELECT COUNT(*) AS joined_in_q1, COUNT(p.subscriber_id) AS paying_today,
             ROUND(COUNT(p.subscriber_id) * 100.0 / COUNT(*), 1) AS percent_paying_today
      FROM cohort AS c LEFT JOIN paying AS p ON p.subscriber_id = c.subscriber_id

  - id: hs03
    category: hard_sql
    persona: marketing
    ask: for people who started on free and later went paid, what's the median time they spent on free before upgrading?
    routes: ["genie:subscribers_revenue"]
    notes: Median days on the free plan before the move to a paid plan. Accept within 3 days, or the same figure expressed in weeks or months.
    gold: |
      SELECT PERCENTILE(DATEDIFF(new_row.activation_date, old_row.activation_date), 0.5) AS median_days_on_free, COUNT(*) AS upgrades
      FROM {subscriber}.subscription AS old_row
      JOIN {subscriber}.subscription_plan AS op ON op.subscription_plan_id = old_row.subscription_plan_id
      JOIN {subscriber}.subscription AS new_row
        ON new_row.subscriber_id = old_row.subscriber_id AND new_row.activation_date = old_row.termination_date
      JOIN {subscriber}.subscription_plan AS np ON np.subscription_plan_id = new_row.subscription_plan_id
      WHERE old_row.subscription_status = 'Superseded' AND op.plan_type = 'Free' AND np.plan_type = 'Paid'

  - id: hs04
    category: hard_sql
    persona: finance
    ask: which plan has the worst payment failure rate, and how much is sitting in overdue invoices on that plan?
    routes: ["genie:subscribers_revenue"]
    notes: Both parts are required for the plan in the first row of the trusted result. Accept the overdue amount within 2 percent.
    gold: |
      SELECT p.plan_name,
             ROUND(SUM(CASE WHEN pay.payment_status = 'Failed' THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS failure_percent,
             ROUND(SUM(CASE WHEN i.invoice_status = 'Overdue' THEN i.total_amount_due ELSE 0 END), 0) AS overdue_usd
      FROM {billing}.invoice AS i
      JOIN {billing}.payment AS pay ON pay.invoice_id = i.invoice_id
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = i.subscription_plan_id
      GROUP BY p.plan_name ORDER BY failure_percent DESC

  - id: hs05
    category: hard_sql
    persona: exec
    ask: which 3 countries have the highest monthly revenue per paying subscriber?
    routes: ["genie:subscribers_revenue"]
    notes: Monthly recurring revenue divided by paying subscribers, per country. The three countries must match; accept values within 2 percent.
    gold: |
      SELECT t.name AS country, COUNT(DISTINCT s.subscriber_id) AS paying_subscribers,
             ROUND(SUM(CASE WHEN s.subscription_type = 'Annual' THEN s.base_rate_amount / 12 ELSE s.base_rate_amount END)
                   / COUNT(DISTINCT s.subscriber_id), 2) AS monthly_revenue_per_paying_subscriber
      FROM {subscriber}.subscription AS s
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = s.subscriber_id
      JOIN {rights}.territory AS t ON t.territory_id = sb.territory_id
      WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'
      GROUP BY t.name ORDER BY monthly_revenue_per_paying_subscriber DESC LIMIT 3

  - id: hs06
    category: hard_sql
    persona: content
    ask: for each region, what was the number one title by watch hours last quarter?
    routes: ["genie:content_viewing"]
    notes: One title per region for the last full calendar quarter. All four regions are required.
    gold: |
      WITH watched AS (
        SELECT tr.territory_group AS region, t.title_id, t.name, SUM(p.total_watch_duration_seconds) AS seconds
        FROM {distribution}.playback_session AS p
        JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
        JOIN {content}.title AS t ON t.title_id = e.title_id
        JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = p.subscriber_id
        JOIN {rights}.territory AS tr ON tr.territory_id = sb.territory_id
        WHERE p.session_start_timestamp >= DATE_TRUNC('QUARTER', ADD_MONTHS({today}, -3))
          AND p.session_start_timestamp < DATE_TRUNC('QUARTER', {today})
        GROUP BY tr.territory_group, t.title_id, t.name
      )
      SELECT region, title_id, name, ROUND(seconds / 3600.0, 0) AS watch_hours
      FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY region ORDER BY seconds DESC) AS rn FROM watched)
      WHERE rn = 1 ORDER BY region

  - id: hs07
    category: hard_sql
    persona: content
    ask: what share of last month's viewers watched more than one franchise?
    routes: ["genie:content_viewing"]
    notes: Accept within 1 point.
    gold: |
      WITH per_viewer AS (
        SELECT p.subscriber_id, COUNT(DISTINCT se.franchise_name) AS franchises
        FROM {distribution}.playback_session AS p
        JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
        JOIN {content}.title AS t ON t.title_id = e.title_id
        JOIN {content}.series AS se ON se.series_id = t.series_id
        WHERE p.session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
          AND p.session_start_timestamp < DATE_TRUNC('MONTH', {today})
        GROUP BY p.subscriber_id
      )
      SELECT COUNT(*) AS viewers, SUM(CASE WHEN franchises > 1 THEN 1 ELSE 0 END) AS watched_more_than_one,
             ROUND(SUM(CASE WHEN franchises > 1 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS percent
      FROM per_viewer

  - id: hs08
    category: hard_sql
    persona: analyst
    ask: how concentrated is viewing? what % of last month's viewers account for half of all watch hours
    routes: ["genie:content_viewing"]
    notes: The smallest share of viewers, ranked by their watch hours, that covers half of last month's watch hours. Accept within 1.5 points.
    gold: |
      WITH per_viewer AS (
        SELECT subscriber_id, SUM(total_watch_duration_seconds) AS seconds
        FROM {distribution}.playback_session
        WHERE session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
          AND session_start_timestamp < DATE_TRUNC('MONTH', {today})
        GROUP BY subscriber_id
      ),
      ranked AS (
        SELECT seconds, SUM(seconds) OVER (ORDER BY seconds DESC, subscriber_id) AS running,
               SUM(seconds) OVER () AS total, COUNT(*) OVER () AS viewers
        FROM per_viewer
      )
      SELECT MAX(viewers) AS viewers,
             SUM(CASE WHEN running - seconds < total / 2 THEN 1 ELSE 0 END) AS viewers_covering_half,
             ROUND(SUM(CASE WHEN running - seconds < total / 2 THEN 1 ELSE 0 END) * 100.0 / MAX(viewers), 1) AS percent_of_viewers
      FROM ranked

  - id: hs09
    category: hard_sql
    persona: finance
    ask: rank licensors by how much of their royalties is overdue, as a share of everything we've been billed by them. top 5
    routes: [genie_one, fallback_agent]
    notes: Overdue net royalty divided by all net royalty on the licensor's statements. The five licensors must match, in any order. Accept shares within 1 point.
    gold: |
      SELECT h.rights_holder_name AS licensor,
             ROUND(SUM(CASE WHEN rs.statement_status = 'Overdue' THEN rs.net_royalty_amount ELSE 0 END) * 100.0
                   / SUM(rs.net_royalty_amount), 1) AS overdue_share_percent,
             ROUND(SUM(CASE WHEN rs.statement_status = 'Overdue' THEN rs.net_royalty_amount ELSE 0 END), 0) AS overdue_net
      FROM {rights}.royalty_statement AS rs
      JOIN {rights}.holder AS h ON h.holder_id = rs.holder_id
      GROUP BY h.rights_holder_name ORDER BY overdue_share_percent DESC LIMIT 5

  - id: hs10
    category: hard_sql
    persona: ad_ops
    ask: for campaigns that have finished, what % hit at least 95% of their impression target, by objective?
    routes: [genie_one, fallback_agent]
    notes: Completed campaigns only. Accept within 2 points per objective.
    gold: |
      WITH delivered AS (SELECT campaign_id, COUNT(*) AS delivered FROM {sales}.impression_delivery GROUP BY campaign_id)
      SELECT c.campaign_type AS objective, COUNT(*) AS completed_campaigns,
             ROUND(SUM(CASE WHEN COALESCE(d.delivered, 0) >= 0.95 * c.target_impressions THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS percent_hitting_95
      FROM {sales}.campaign AS c
      LEFT JOIN delivered AS d ON d.campaign_id = c.campaign_id
      WHERE c.campaign_status = 'Completed'
      GROUP BY c.campaign_type ORDER BY objective

  - id: hs11
    category: hard_sql
    persona: licensing
    ask: in the last two years, which quarter did we sign the most licence fee value?
    routes: [genie_one, fallback_agent]
    notes: By signing date, over the eight full quarters before the current one. The quarter must match; accept the amount within 2 percent.
    gold: |
      SELECT DATE_TRUNC('QUARTER', signed_date) AS quarter, ROUND(SUM(total_license_fee), 0) AS license_fees_signed, COUNT(*) AS agreements
      FROM {rights}.license_agreement
      WHERE signed_date >= ADD_MONTHS(DATE_TRUNC('QUARTER', {today}), -24) AND signed_date < DATE_TRUNC('QUARTER', {today})
      GROUP BY 1 ORDER BY license_fees_signed DESC LIMIT 1

  - id: hs12
    category: hard_sql
    persona: licensing
    ask: how long does it take from signing to an agreement going live, on average, by agreement type?
    routes: [genie_one, fallback_agent]
    notes: Average days between signed date and effective date. Accept within 1 day per type.
    gold: |
      SELECT agreement_type, ROUND(AVG(DATEDIFF(effective_date, signed_date)), 1) AS average_days, COUNT(*) AS agreements
      FROM {rights}.license_agreement GROUP BY agreement_type ORDER BY agreement_type

  # ---------------------------------------------------------------- data traps
  - id: dt01
    category: data_trap
    persona: exec
    ask: how many subscriptions churned last month?
    routes: ["genie:subscribers_revenue"]
    notes: Churn means cancellations. Accept the count for all plans or for paid plans only if the answer says which. A figure that includes plan changes (superseded subscriptions) is incorrect.
    gold: |
      SELECT COUNT(*) AS cancellations_all_plans, SUM(CASE WHEN p.plan_type = 'Paid' THEN 1 ELSE 0 END) AS cancellations_paid_plans
      FROM {subscriber}.churn_event AS c
      JOIN {subscriber}.subscription AS s ON s.subscription_id = c.subscription_id
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      WHERE c.churn_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND c.churn_timestamp < DATE_TRUNC('MONTH', {today})

  - id: dt02
    category: data_trap
    persona: marketing
    ask: what does a Fan monthly subscriber in Brazil pay per month right now?
    routes: ["genie:subscribers_revenue"]
    notes: The price actually paid in Brazil, which is higher than the list price after the regional price rise. Giving only the list price of 7.99 is incorrect.
    gold: |
      SELECT s.base_rate_amount AS monthly_price_paid, COUNT(*) AS subscribers, MAX(p.base_price) AS list_price
      FROM {subscriber}.subscription AS s
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = s.subscriber_id
      WHERE p.plan_code = 'FAN-M' AND s.subscription_status = 'Active' AND sb.country_code = 'BR'
      GROUP BY s.base_rate_amount

  - id: dt03
    category: data_trap
    persona: finance
    ask: total payments we received last month?
    routes: ["genie:subscribers_revenue"]
    notes: Only payments that succeeded count as received. The total of all attempts, which includes failed payments, is incorrect.
    gold: |
      SELECT ROUND(SUM(CASE WHEN payment_status = 'Succeeded' THEN amount ELSE 0 END), 2) AS received_usd,
             ROUND(SUM(amount), 2) AS attempted_usd_including_failed
      FROM {billing}.payment
      WHERE payment_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND payment_date < DATE_TRUNC('MONTH', {today})

  - id: dt04
    category: data_trap
    persona: content
    ask: 'how many hours have people watched "Paper Tempest: The Film"?'
    routes: ["genie:content_viewing"]
    notes: Several different titles share this name. A correct answer gives the total across all of them, or says there are several and breaks them down. Hours for only one of them, without saying so, is incorrect.
    gold: |
      SELECT COUNT(DISTINCT t.title_id) AS titles_with_this_name, ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 1) AS watch_hours_all_of_them
      FROM {content}.title AS t
      LEFT JOIN {content}.content_episode AS e ON e.title_id = t.title_id
      LEFT JOIN {distribution}.playback_session AS p ON p.content_episode_id = e.content_episode_id
      WHERE t.name = 'Paper Tempest: The Film'

  - id: dt05
    category: data_trap
    persona: exec
    ask: how many active accounts do we have in North America, and which countries is that?
    routes: ["genie:subscribers_revenue"]
    notes: The North America region covers four territories, not only the United States. All four must be named and the total must match within 1 percent.
    gold: |
      SELECT t.name AS country, COUNT(*) AS active_accounts, SUM(COUNT(*)) OVER () AS north_america_total
      FROM {subscriber}.subscriber AS s
      JOIN {rights}.territory AS t ON t.territory_id = s.territory_id
      WHERE t.territory_group = 'NA' AND s.account_status = 'Active'
      GROUP BY t.name ORDER BY active_accounts DESC

  - id: dt06
    category: data_trap
    persona: licensing
    ask: how many license agreements are actually in force today?
    routes: [genie_one, fallback_agent]
    notes: In force means the agreement has started and has not expired. The count of agreements whose status is Active is higher, because some of those start in the future; that count alone is incorrect unless the answer explains the difference.
    gold: |
      SELECT COUNT(*) AS in_force_today,
             (SELECT COUNT(*) FROM {rights}.license_agreement WHERE agreement_status = 'Active') AS status_active
      FROM {rights}.license_agreement
      WHERE effective_date <= {today} AND expiry_date >= {today}

  - id: dt07
    category: data_trap
    persona: partnerships
    ask: what percent of our minimum guarantees has been recouped?
    routes: [genie_one, fallback_agent]
    notes: By amount, about 90 percent. An answer by count (the share of guarantees fully recouped, 80 percent) is acceptable if it says it is a count. An answer of 100 percent is incorrect.
    gold: |
      SELECT ROUND(SUM(recouped_to_date_amount) * 100.0 / SUM(mg_amount), 1) AS percent_recouped_by_amount,
             ROUND(SUM(CASE WHEN mg_status = 'Recouped' THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS percent_of_guarantees_fully_recouped
      FROM {partner}.minimum_guarantee

  - id: dt08
    category: data_trap
    persona: analyst
    ask: how many people signed up in the first week of January 2024?
    routes: ["genie:subscribers_revenue"]
    notes: The data starts on 10 January 2024, so there are no sign-ups recorded for 1 to 7 January. A correct answer says none are recorded and that the data starts later. A plain zero without that caveat is incorrect.
    gold: |
      WITH first_subscription AS (
        SELECT subscriber_id, MIN(activation_date) AS joined FROM {subscriber}.subscription GROUP BY subscriber_id
      )
      SELECT MIN(joined) AS earliest_sign_up_in_data,
             SUM(CASE WHEN joined BETWEEN DATE'2024-01-01' AND DATE'2024-01-07' THEN 1 ELSE 0 END) AS sign_ups_1_to_7_january_2024
      FROM first_subscription

  - id: dt09
    category: data_trap
    persona: exec
    ask: what was churn in November?
    routes: ["genie:subscribers_revenue"]
    notes: November of this year has only nine days of data. A correct answer gives the cancellations so far (all plans or paid only, labelled) and says the month is partial. Presenting it as a full month is incorrect.
    gold: |
      SELECT COUNT(*) AS cancellations_all_plans, SUM(CASE WHEN p.plan_type = 'Paid' THEN 1 ELSE 0 END) AS cancellations_paid_plans,
             MAX(CAST(c.churn_timestamp AS DATE)) AS latest_day_in_data
      FROM {subscriber}.churn_event AS c
      JOIN {subscriber}.subscription AS s ON s.subscription_id = c.subscription_id
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      WHERE c.churn_timestamp >= DATE_TRUNC('MONTH', {today})

  - id: dt10
    category: data_trap
    persona: ad_sales
    ask: which franchises did Larkspur Motors ads actually run on the most? top 3
    routes: [genie_one, fallback_agent]
    notes: Where ads ran comes from the episode each impression was served on. A ranking based on the series the campaigns are themed around is incorrect.
    gold: |
      SELECT se.franchise_name, COUNT(*) AS impressions
      FROM {sales}.impression_delivery AS i
      JOIN {sales}.campaign AS c ON c.campaign_id = i.campaign_id
      JOIN {sales}.advertiser AS a ON a.advertiser_id = c.advertiser_id
      JOIN {content}.content_episode AS e ON e.content_episode_id = i.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      JOIN {content}.series AS se ON se.series_id = t.series_id
      WHERE a.trade_name = 'Larkspur Motors'
      GROUP BY se.franchise_name ORDER BY impressions DESC LIMIT 3

  # ---------------------------------------------------------------- multi hop
  - id: mh01
    category: multi_hop
    persona: finance
    ask: overdue royalties as a % of what we collected from subscribers last month?
    routes: [genie_one, fallback_agent, "genie:subscribers_revenue"]
    notes: Overdue net royalties divided by cash collected from subscription invoices in the last full calendar month. Both inputs and the ratio are required. Accept the ratio within 3 percent of its value.
    gold: |
      SELECT overdue.usd AS overdue_net_royalties_usd, collected.usd AS collected_last_month_usd,
             ROUND(overdue.usd * 100.0 / collected.usd, 1) AS overdue_as_percent_of_collected
      FROM (SELECT ROUND(SUM(net_royalty_amount), 2) AS usd FROM {rights}.royalty_statement WHERE statement_status = 'Overdue') AS overdue
      CROSS JOIN (SELECT ROUND(SUM(amount_paid), 2) AS usd FROM {billing}.invoice
                  WHERE invoice_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND invoice_date < DATE_TRUNC('MONTH', {today})) AS collected

  - id: mh02
    category: multi_hop
    persona: ad_sales
    ask: ad revenue per free subscriber last month?
    routes: [genie_one, fallback_agent, "genie:subscribers_revenue"]
    notes: Last month's ad revenue divided by subscribers currently on the free plan. A few cents per subscriber. Accept within 5 percent. Dividing by the free viewers who saw an ad last month is acceptable if the answer says so.
    gold: |
      SELECT ad.usd AS ad_revenue_usd, free.subscribers AS free_subscribers, ROUND(ad.usd / free.subscribers, 4) AS ad_revenue_per_free_subscriber
      FROM (SELECT SUM(cpm_realized) / 1000.0 AS usd FROM {sales}.impression_delivery
            WHERE delivery_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND delivery_date < DATE_TRUNC('MONTH', {today})) AS ad
      CROSS JOIN (SELECT COUNT(DISTINCT s.subscriber_id) AS subscribers
                  FROM {subscriber}.subscription AS s
                  JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
                  WHERE s.subscription_status = 'Active' AND p.plan_type = 'Free') AS free

  - id: mh03
    category: multi_hop
    persona: exec
    ask: how much licence fee is expiring in the next 90 days per paying subscriber?
    routes: [genie_one, fallback_agent, "genie:subscribers_revenue"]
    notes: Total licence fee of agreements expiring in the next 90 days divided by current paying subscribers. Accept within 3 percent.
    gold: |
      SELECT fees.usd AS expiring_license_fees_usd, paying.subscribers AS paying_subscribers, ROUND(fees.usd / paying.subscribers, 2) AS usd_per_paying_subscriber
      FROM (SELECT SUM(total_license_fee) AS usd FROM {rights}.license_agreement
            WHERE expiry_date >= {today} AND expiry_date <= {today} + INTERVAL 90 DAYS) AS fees
      CROSS JOIN (SELECT COUNT(DISTINCT s.subscriber_id) AS subscribers
                  FROM {subscriber}.subscription AS s
                  JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
                  WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid') AS paying

  - id: mh04
    category: multi_hop
    persona: licensing
    ask: what share of last month's watch hours came from titles with no active window in the viewer's own country?
    routes: [genie_one, fallback_agent]
    notes: Accept within 2 points.
    gold: |
      WITH active AS (SELECT DISTINCT title_id, territory_id FROM {rights}.content_window WHERE active_flag = true)
      SELECT ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours,
             ROUND(SUM(CASE WHEN a.title_id IS NULL THEN p.total_watch_duration_seconds ELSE 0 END) / 3600.0, 0) AS hours_without_active_window,
             ROUND(SUM(CASE WHEN a.title_id IS NULL THEN p.total_watch_duration_seconds ELSE 0 END) * 100.0
                   / SUM(p.total_watch_duration_seconds), 1) AS percent_without_active_window
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {subscriber}.subscriber AS s ON s.subscriber_id = p.subscriber_id
      LEFT JOIN active AS a ON a.title_id = e.title_id AND a.territory_id = s.territory_id
      WHERE p.session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
        AND p.session_start_timestamp < DATE_TRUNC('MONTH', {today})

  - id: mh05
    category: multi_hop
    persona: ad_sales
    ask: our top 3 franchises by watch hours of all time, and how many ad impressions has each one carried?
    routes: [genie_one, fallback_agent, "genie:content_viewing"]
    notes: The three franchises and an impression count for each are required. Impressions are counted through the episode the ad ran on. Accept impression counts within 2 percent.
    gold: |
      WITH watch AS (
        SELECT se.franchise_name, SUM(p.total_watch_duration_seconds) AS seconds
        FROM {distribution}.playback_session AS p
        JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
        JOIN {content}.title AS t ON t.title_id = e.title_id
        JOIN {content}.series AS se ON se.series_id = t.series_id
        GROUP BY se.franchise_name ORDER BY seconds DESC LIMIT 3
      ),
      ads AS (
        SELECT se.franchise_name, COUNT(*) AS impressions
        FROM {sales}.impression_delivery AS i
        JOIN {content}.content_episode AS e ON e.content_episode_id = i.content_episode_id
        JOIN {content}.title AS t ON t.title_id = e.title_id
        JOIN {content}.series AS se ON se.series_id = t.series_id
        GROUP BY se.franchise_name
      )
      SELECT w.franchise_name, ROUND(w.seconds / 3600.0, 0) AS watch_hours, COALESCE(a.impressions, 0) AS ad_impressions
      FROM watch AS w LEFT JOIN ads AS a ON a.franchise_name = w.franchise_name
      ORDER BY w.seconds DESC

  - id: mh06
    category: multi_hop
    persona: exec
    ask: one table by region please - paying subs, MRR, and ad impressions last month
    routes: [genie_one, fallback_agent, "genie:subscribers_revenue"]
    notes: All three measures for all four regions. Accept each figure within 2 percent.
    gold: |
      WITH subs AS (
        SELECT t.territory_group AS region, COUNT(DISTINCT s.subscriber_id) AS paying_subscribers,
               ROUND(SUM(CASE WHEN s.subscription_type = 'Annual' THEN s.base_rate_amount / 12 ELSE s.base_rate_amount END), 0) AS mrr_usd
        FROM {subscriber}.subscription AS s
        JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
        JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = s.subscriber_id
        JOIN {rights}.territory AS t ON t.territory_id = sb.territory_id
        WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'
        GROUP BY t.territory_group
      ),
      ads AS (
        SELECT t.territory_group AS region, COUNT(*) AS ad_impressions_last_month
        FROM {sales}.impression_delivery AS i
        JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = i.subscriber_id
        JOIN {rights}.territory AS t ON t.territory_id = sb.territory_id
        WHERE i.delivery_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND i.delivery_date < DATE_TRUNC('MONTH', {today})
        GROUP BY t.territory_group
      )
      SELECT s.region, s.paying_subscribers, s.mrr_usd, a.ad_impressions_last_month
      FROM subs AS s LEFT JOIN ads AS a ON a.region = s.region ORDER BY s.region

