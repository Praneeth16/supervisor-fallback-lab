# Benchmark for the supervisor fallback lab.
#
# Questions are written the way people type to a data assistant: short, casual, with shorthand,
# the odd typo and vague dates. Each one says which agent should handle it and what a correct
# reply looks like:
#   routes    agents that count as the right route. genie_one and fallback_agent are the two
#             fallbacks; each supervisor only has one of them.
#   behavior  answer (default), refuse, or clarify (a question back, or an answer that states
#             the assumption it made).
#   gold      reference SQL, run at evaluation time. {subscriber}, {rights}, ... expand to schema
#             names and {today} to the data's as-of date.
#   notes     extra guidance for the judge.
#
# Categories: curated_subscriber, curated_content (a curated Genie Agent covers it),
# long_tail (only the fallback has the data), cross_domain (needs a join across areas),
# must_refuse (outside the agreed scope), ambiguous.

questions:
  # ---------------------------------------------------------------- curated: subscribers and revenue
  - id: cs01
    category: curated_subscriber
    persona: exec
    ask: how many paying subs do we have right now?
    routes: [genie:subscribers_revenue]
    gold: |
      SELECT COUNT(DISTINCT s.subscriber_id) AS paying_subscribers
      FROM {subscriber}.subscription AS s
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'

  - id: cs02
    category: curated_subscriber
    persona: analyst
    ask: paying subscribers by plan pls
    routes: [genie:subscribers_revenue]
    gold: |
      SELECT p.plan_name, COUNT(DISTINCT s.subscriber_id) AS paying_subscribers
      FROM {subscriber}.subscription AS s
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'
      GROUP BY p.plan_name ORDER BY paying_subscribers DESC

  - id: cs03
    category: curated_subscriber
    persona: marketing
    ask: which region has the most paying customers?
    routes: [genie:subscribers_revenue]
    gold: |
      SELECT t.territory_group AS region, COUNT(DISTINCT s.subscriber_id) AS paying_subscribers
      FROM {subscriber}.subscription AS s
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = s.subscriber_id
      JOIN {rights}.territory AS t ON t.territory_id = sb.territory_id
      WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'
      GROUP BY t.territory_group ORDER BY paying_subscribers DESC

  - id: cs04
    category: curated_subscriber
    persona: exec
    ask: whats our MRR?
    routes: [genie:subscribers_revenue]
    notes: Monthly recurring revenue counts annual plans at one twelfth of their price. Accept a figure within 1 percent.
    gold: |
      SELECT ROUND(SUM(CASE WHEN s.subscription_type = 'Annual' THEN s.base_rate_amount / 12 ELSE s.base_rate_amount END), 2) AS mrr_usd
      FROM {subscriber}.subscription AS s
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'

  - id: cs05
    category: curated_subscriber
    persona: finance
    ask: how much did we actually collect last month?
    routes: [genie:subscribers_revenue]
    notes: Last month is the last full calendar month before the as-of date. The answer must give cash collected (amount paid). Giving the billed amount as well is fine.
    gold: |
      SELECT ROUND(SUM(amount_paid), 2) AS collected, ROUND(SUM(total_amount_due), 2) AS billed_with_tax
      FROM {billing}.invoice
      WHERE invoice_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND invoice_date < DATE_TRUNC('MONTH', {today})

  - id: cs06
    category: curated_subscriber
    persona: analyst
    ask: new signups per month this year - are we trending up or down?
    routes: [genie:subscribers_revenue]
    notes: Monthly sign-ups this year move within a narrow band of a few percent. Accept a conclusion of flat or slightly down. The answer is incorrect if it reads the partial current month as a drop, or describes a clear or strong decline. Small differences from using the registration date instead of the first activation date are acceptable.
    gold: |
      WITH first_subscription AS (
        SELECT subscriber_id, MIN(activation_date) AS signup_date FROM {subscriber}.subscription GROUP BY subscriber_id
      )
      SELECT DATE_TRUNC('MONTH', signup_date) AS signup_month, COUNT(*) AS new_subscribers
      FROM first_subscription
      WHERE signup_date >= DATE_TRUNC('YEAR', {today}) AND signup_date < {today}
      GROUP BY 1 ORDER BY 1

  - id: cs07
    category: curated_subscriber
    persona: exec
    ask: churn looked rough over the summer. how many paid subs did we lose in may and june compared with april?
    routes: [genie:subscribers_revenue]
    gold: |
      SELECT DATE_TRUNC('MONTH', c.churn_timestamp) AS churn_month, COUNT(*) AS paid_churns
      FROM {subscriber}.churn_event AS c
      JOIN {subscriber}.subscription AS s ON s.subscription_id = c.subscription_id
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      WHERE p.plan_type = 'Paid'
        AND c.churn_timestamp >= MAKE_DATE(YEAR({today}), 4, 1) AND c.churn_timestamp < MAKE_DATE(YEAR({today}), 7, 1)
      GROUP BY 1 ORDER BY 1

  - id: cs08
    category: curated_subscriber
    persona: marketing
    ask: why are ppl in latam cancelling lately?
    routes: [genie:subscribers_revenue]
    notes: The answer must identify price (the mid-year price increase) as the main driver of recent LATAM cancellations. It may add that the last few weeks show other reasons on top. Exact counts depend on the period chosen and need not match. An answer that only lists the reasons of the current partial month and does not name price as the main driver is incorrect.
    gold: |
      SELECT c.cancellation_reason_code AS reason, COUNT(*) AS churns
      FROM {subscriber}.churn_event AS c
      JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = c.subscriber_id
      JOIN {rights}.territory AS t ON t.territory_id = sb.territory_id
      WHERE t.territory_group = 'LATAM' AND c.churn_timestamp >= ADD_MONTHS({today}, -6)
      GROUP BY 1 ORDER BY churns DESC

  - id: cs09
    category: curated_subscriber
    persona: finance
    ask: which payment method fails the most and how bad is it?
    routes: [genie:subscribers_revenue]
    gold: |
      SELECT method_type, ROUND(SUM(CASE WHEN payment_status = 'Failed' THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS failure_percent
      FROM {billing}.payment GROUP BY method_type ORDER BY failure_percent DESC

  - id: cs10
    category: curated_subscriber
    persona: finance
    ask: how much have we refunded so far this year?
    routes: [genie:subscribers_revenue]
    notes: Processed refunds this calendar year. An answer that also counts requested refunds is acceptable only if it says so and gives the processed figure.
    gold: |
      SELECT ROUND(SUM(amount), 2) AS refunded, COUNT(*) AS refunds
      FROM {billing}.refund
      WHERE refund_status = 'Processed' AND processing_date >= DATE_TRUNC('YEAR', {today}) AND processing_date < {today}

  - id: cs11
    category: curated_subscriber
    persona: analyst
    ask: what % of our paying subs are on annual vs monthly?
    routes: [genie:subscribers_revenue]
    gold: |
      SELECT s.subscription_type,
             COUNT(DISTINCT s.subscriber_id) AS paying_subscribers,
             ROUND(COUNT(DISTINCT s.subscriber_id) * 100.0 / SUM(COUNT(DISTINCT s.subscriber_id)) OVER (), 1) AS percent
      FROM {subscriber}.subscription AS s
      JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
      WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'
      GROUP BY s.subscription_type

  - id: cs12
    category: curated_subscriber
    persona: exec
    ask: how many folks have moved from the free plan to a paid one?
    routes: [genie:subscribers_revenue]
    gold: |
      SELECT COUNT(*) AS free_to_paid
      FROM {subscriber}.subscription AS old_row
      JOIN {subscriber}.subscription_plan AS op ON op.subscription_plan_id = old_row.subscription_plan_id
      JOIN {subscriber}.subscription AS new_row
        ON new_row.subscriber_id = old_row.subscriber_id AND new_row.activation_date = old_row.termination_date
      JOIN {subscriber}.subscription_plan AS np ON np.subscription_plan_id = new_row.subscription_plan_id
      WHERE old_row.subscription_status = 'Superseded' AND op.plan_type = 'Free' AND np.plan_type = 'Paid'

  # ---------------------------------------------------------------- curated: content and viewing
  - id: cc01
    category: curated_content
    persona: exec
    ask: which single title has racked up the most watch hours all time?
    routes: [genie:content_viewing]
    gold: |
      SELECT t.title_id, t.name, ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      GROUP BY t.title_id, t.name ORDER BY SUM(p.total_watch_duration_seconds) DESC LIMIT 1

  - id: cc02
    category: curated_content
    persona: analyst
    ask: top 5 genres by hours watched
    routes: [genie:content_viewing]
    gold: |
      SELECT g.name AS genre, ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      JOIN {content}.series AS s ON s.series_id = t.series_id
      JOIN {content}.genre AS g ON g.genre_id = s.genre_id
      GROUP BY g.name ORDER BY SUM(p.total_watch_duration_seconds) DESC LIMIT 5

  - id: cc03
    category: curated_content
    persona: marketing
    ask: how big is Moonlit Blade for us? like share of total watch time
    routes: [genie:content_viewing]
    notes: The franchise share is about 9 percent. An answer that gives only the single title or single series named Moonlit Blade (a smaller share) is incorrect unless it also gives the franchise share.
    gold: |
      SELECT ROUND(SUM(CASE WHEN s.franchise_name = 'Moonlit Blade' THEN p.total_watch_duration_seconds ELSE 0 END) * 100.0
                   / SUM(p.total_watch_duration_seconds), 2) AS franchise_share_percent
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      JOIN {content}.series AS s ON s.series_id = t.series_id

  - id: cc04
    category: curated_content
    persona: exec
    ask: simulcast vs back catalog, how does watch time split?
    routes: [genie:content_viewing]
    gold: |
      SELECT CASE WHEN t.is_simulcast THEN 'simulcast' ELSE 'catalogue' END AS kind,
             ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours,
             ROUND(SUM(p.total_watch_duration_seconds) * 100.0 / SUM(SUM(p.total_watch_duration_seconds)) OVER (), 1) AS share_percent
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      GROUP BY 1

  - id: cc05
    category: curated_content
    persona: analyst
    ask: dub vs sub by region?
    routes: [genie:content_viewing]
    notes: Dubbed means audio that is not Japanese. Accept shares measured by sessions or by watch time, within 2 points of the trusted figures. The ordering of regions must match.
    gold: |
      SELECT tr.territory_group AS region,
             ROUND(SUM(CASE WHEN p.audio_language <> 'Japanese' THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS dubbed_percent_of_sessions
      FROM {distribution}.playback_session AS p
      JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = p.subscriber_id
      JOIN {rights}.territory AS tr ON tr.territory_id = sb.territory_id
      GROUP BY tr.territory_group ORDER BY 2 DESC

  - id: cc06
    category: curated_content
    persona: product
    ask: what devices do people watch on the most?
    routes: [genie:content_viewing]
    notes: Accept a ranking by watch hours or by sessions. Smart TV and Console lead and are nearly equal.
    gold: |
      SELECT platform_type, ROUND(SUM(total_watch_duration_seconds) / 3600.0, 0) AS watch_hours, COUNT(*) AS sessions
      FROM {distribution}.playback_session GROUP BY platform_type ORDER BY watch_hours DESC

  - id: cc07
    category: curated_content
    persona: analyst
    ask: how many viewing sessions did we get last month?
    routes: [genie:content_viewing]
    gold: |
      SELECT COUNT(*) AS sessions FROM {distribution}.playback_session
      WHERE session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
        AND session_start_timestamp < DATE_TRUNC('MONTH', {today})

  - id: cc08
    category: curated_content
    persona: marketing
    ask: which month this year was the biggest for viewing?
    routes: [genie:content_viewing]
    notes: Accept the month measured by sessions or by watch hours as long as it is the same month as the trusted result.
    gold: |
      SELECT DATE_TRUNC('MONTH', session_start_timestamp) AS month, COUNT(*) AS sessions,
             ROUND(SUM(total_watch_duration_seconds) / 3600.0, 0) AS watch_hours
      FROM {distribution}.playback_session
      WHERE session_start_timestamp >= DATE_TRUNC('YEAR', {today})
      GROUP BY 1 ORDER BY sessions DESC LIMIT 1

  - id: cc09
    category: curated_content
    persona: content
    ask: how many titles do we have, split by series / film / special?
    routes: [genie:content_viewing]
    gold: |
      SELECT content_type, COUNT(*) AS titles FROM {content}.title GROUP BY content_type ORDER BY titles DESC

  - id: cc10
    category: curated_content
    persona: analyst
    ask: avg completion rate for simulcast stuff vs everything else?
    routes: [genie:content_viewing]
    gold: |
      SELECT CASE WHEN t.is_simulcast THEN 'simulcast' ELSE 'catalogue' END AS kind,
             ROUND(AVG(p.completion_percentage), 1) AS avg_completion_percent
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      GROUP BY 1

  - id: cc11
    category: curated_content
    persona: product
    ask: what share of viewing is downloads vs streaming?
    routes: [genie:content_viewing]
    notes: Accept shares by sessions or by watch time within 1 point.
    gold: |
      SELECT playback_mode, COUNT(*) AS sessions, ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 2) AS percent_of_sessions
      FROM {distribution}.playback_session GROUP BY playback_mode

  - id: cc12
    category: curated_content
    persona: content
    ask: how fast do people watch simulcast episodes after they drop? like what % within a week
    routes: [genie:content_viewing]
    notes: About 83 percent of simulcast sessions start within 7 days of the episode air date. Accept 80 to 86 percent.
    gold: |
      SELECT ROUND(SUM(CASE WHEN DATEDIFF(p.session_start_timestamp, e.original_air_date) BETWEEN 0 AND 7 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS within_7_days_percent
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      WHERE t.is_simulcast = true

  # ---------------------------------------------------------------- long tail: only the fallback has it
  - id: lt01
    category: long_tail
    persona: licensing
    ask: which license deals are up for renewal in the next 90 days?
    routes: [genie_one, fallback_agent]
    notes: The answer must give the number of agreements expiring in the next 90 days (accept one more or one less for the date boundary). Naming the licensor that holds about a third of them is welcome but not required, and a full list is not required.
    gold: |
      SELECT h.rights_holder_name AS licensor, COUNT(*) AS expiring_agreements, SUM(COUNT(*)) OVER () AS total_expiring
      FROM {rights}.license_agreement AS l
      JOIN {rights}.holder AS h ON h.holder_id = l.primary_license_holder_id
      WHERE l.expiry_date >= {today} AND l.expiry_date <= {today} + INTERVAL 90 DAYS
      GROUP BY h.rights_holder_name ORDER BY expiring_agreements DESC LIMIT 5

  - id: lt02
    category: long_tail
    persona: licensing
    ask: who's our biggest licensor by license fees on active agreements?
    routes: [genie_one, fallback_agent]
    notes: The trusted result counts agreements whose status is Active. Some of those start in the future. An answer that counts only agreements in force today and names Tsuki Studios Ltd. with about 6.59 million dollars is also correct if it says that is the definition it used.
    gold: |
      SELECT h.rights_holder_name AS licensor, ROUND(SUM(l.total_license_fee), 0) AS license_fees, COUNT(*) AS active_agreements
      FROM {rights}.license_agreement AS l
      JOIN {rights}.holder AS h ON h.holder_id = l.primary_license_holder_id
      WHERE l.agreement_status = 'Active'
      GROUP BY h.rights_holder_name ORDER BY license_fees DESC LIMIT 3

  - id: lt03
    category: long_tail
    persona: finance
    ask: how much do we owe in overdue royalties and who to mostly?
    routes: [genie_one, fallback_agent]
    notes: The total must be the net royalty of statements with status Overdue. The gross figure is acceptable only if labelled gross. Naming the licensor with the largest overdue balance is required.
    gold: |
      SELECT h.rights_holder_name AS licensor, COUNT(*) AS overdue_statements, ROUND(SUM(rs.net_royalty_amount), 2) AS overdue_net,
             ROUND(SUM(SUM(rs.net_royalty_amount)) OVER (), 2) AS total_overdue_net, SUM(COUNT(*)) OVER () AS total_overdue_statements
      FROM {rights}.royalty_statement AS rs
      JOIN {rights}.holder AS h ON h.holder_id = rs.holder_id
      WHERE rs.statement_status = 'Overdue'
      GROUP BY h.rights_holder_name ORDER BY overdue_net DESC LIMIT 3

  - id: lt04
    category: long_tail
    persona: licensing
    ask: how many active content windows do we have per region?
    routes: [genie_one, fallback_agent]
    gold: |
      SELECT t.territory_group AS region, COUNT(*) AS active_windows
      FROM {rights}.content_window AS w
      JOIN {rights}.territory AS t ON t.territory_id = w.territory_id
      WHERE w.active_flag = true
      GROUP BY t.territory_group ORDER BY active_windows DESC

  - id: lt05
    category: long_tail
    persona: ad_ops
    ask: is Larkspur Motors getting what they paid for? delivered vs ordered impressions
    routes: [genie_one, fallback_agent]
    notes: Larkspur Motors received about 70 percent of the impressions it ordered. Ordered impressions may be taken from campaign targets or from order lines; both are about 45.3 thousand.
    gold: |
      WITH delivered AS (
        SELECT campaign_id, COUNT(*) AS delivered FROM {sales}.impression_delivery GROUP BY campaign_id
      )
      SELECT SUM(c.target_impressions) AS ordered_impressions, SUM(d.delivered) AS delivered_impressions,
             ROUND(SUM(d.delivered) * 100.0 / SUM(c.target_impressions), 1) AS delivered_percent
      FROM {sales}.campaign AS c
      JOIN {sales}.advertiser AS a ON a.advertiser_id = c.advertiser_id
      LEFT JOIN delivered AS d ON d.campaign_id = c.campaign_id
      WHERE a.trade_name = 'Larkspur Motors'

  - id: lt06
    category: long_tail
    persona: ad_ops
    ask: avg CPM by campaign objective?
    routes: [genie_one, fallback_agent]
    notes: Realised CPM is about 12 for Awareness, 18 for Consideration, 26 for Conversion and 34 for Brand Launch. Figures derived from the rounded per-impression revenue column (for example 10 for Awareness) are incorrect.
    gold: |
      SELECT c.campaign_type AS objective, ROUND(AVG(i.cpm_realized), 2) AS average_cpm
      FROM {sales}.impression_delivery AS i
      JOIN {sales}.campaign AS c ON c.campaign_id = i.campaign_id
      GROUP BY c.campaign_type ORDER BY average_cpm

  - id: lt07
    category: long_tail
    persona: ad_sales
    ask: how many advertisers do we have in each industry?
    routes: [genie_one, fallback_agent]
    gold: |
      SELECT industry_category, COUNT(*) AS advertisers FROM {sales}.advertiser GROUP BY industry_category ORDER BY advertisers DESC

  - id: lt08
    category: long_tail
    persona: ad_ops
    ask: how many ad impressions did we deliver last month?
    routes: [genie_one, fallback_agent]
    gold: |
      SELECT COUNT(*) AS impressions FROM {sales}.impression_delivery
      WHERE delivery_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND delivery_date < DATE_TRUNC('MONTH', {today})

  - id: lt09
    category: long_tail
    persona: partnerships
    ask: how much of our minimum guarantees is still not recouped?
    routes: [genie_one, fallback_agent]
    notes: The answer must give the outstanding balance in dollars. Giving the number or share of guarantees still recouping as well is good but not required.
    gold: |
      SELECT ROUND(SUM(outstanding_balance_amount), 0) AS outstanding_usd, ROUND(SUM(mg_amount), 0) AS total_mg_usd,
             SUM(CASE WHEN mg_status = 'Recouping' THEN 1 ELSE 0 END) AS guarantees_still_recouping, COUNT(*) AS guarantees
      FROM {partner}.minimum_guarantee

  - id: lt10
    category: long_tail
    persona: partnerships
    ask: which partner has the biggest outstanding MG balance?
    routes: [genie_one, fallback_agent]
    gold: |
      SELECT p.name AS partner, ROUND(SUM(m.outstanding_balance_amount), 0) AS outstanding_usd
      FROM {partner}.minimum_guarantee AS m
      JOIN {partner}.acquisition_deal AS d ON d.acquisition_deal_id = m.acquisition_deal_id
      JOIN {partner}.partner AS p ON p.partner_id = d.partner_id
      GROUP BY p.name ORDER BY outstanding_usd DESC LIMIT 1

  - id: lt11
    category: long_tail
    persona: licensing
    ask: license agreements by type, and how many of each are still active?
    routes: [genie_one, fallback_agent]
    gold: |
      SELECT agreement_type, COUNT(*) AS agreements, SUM(CASE WHEN agreement_status = 'Active' THEN 1 ELSE 0 END) AS active_agreements
      FROM {rights}.license_agreement GROUP BY agreement_type ORDER BY agreements DESC

  - id: lt12
    category: long_tail
    persona: finance
    ask: total royalties we paid out last year?
    routes: [genie_one, fallback_agent]
    notes: Net royalty of statements paid during the last calendar year. A figure based on the statement period or due date instead of the payment date is acceptable if the answer says which date it used and is within 10 percent.
    gold: |
      SELECT ROUND(SUM(net_royalty_amount), 2) AS net_royalties_paid, COUNT(*) AS statements
      FROM {rights}.royalty_statement
      WHERE statement_status = 'Paid'
        AND paid_timestamp >= DATE_TRUNC('YEAR', ADD_MONTHS({today}, -12)) AND paid_timestamp < DATE_TRUNC('YEAR', {today})

  - id: lt13
    category: long_tail
    persona: partnerships
    ask: acquisition deals by deal type - count and total value
    routes: [genie_one, fallback_agent]
    gold: |
      SELECT deal_type, COUNT(*) AS deals, ROUND(SUM(deal_value_amount), 0) AS total_deal_value
      FROM {partner}.acquisition_deal GROUP BY deal_type ORDER BY deals DESC

  - id: lt14
    category: long_tail
    persona: licensing
    ask: whats the split of our license agreements by territory scope?
    routes: [genie_one, fallback_agent]
    gold: |
      SELECT territory_scope, COUNT(*) AS agreements FROM {rights}.license_agreement GROUP BY territory_scope ORDER BY agreements DESC

  # ---------------------------------------------------------------- cross domain: needs a join across areas
  - id: cd01
    category: cross_domain
    persona: licensing
    ask: Ashen Tempest is huge for us. are there any countries where people watch it but we have no active window?
    routes: [genie_one, fallback_agent]
    notes: The answer must single out the countries in the trusted result (codes or full names) as where the main Ashen Tempest title is watched without an active window. Extra detail about later seasons with no window, or about blacked-out windows, is acceptable as long as those two countries are clearly identified.
    gold: |
      SELECT DISTINCT t.name AS country, t.iso_alpha_2_code AS code
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN {subscriber}.subscriber AS s ON s.subscriber_id = p.subscriber_id
      JOIN {rights}.territory AS t ON t.territory_id = s.territory_id
      WHERE e.title_id = 1
        AND NOT EXISTS (
          SELECT 1 FROM {rights}.content_window AS w
          WHERE w.title_id = e.title_id AND w.territory_id = s.territory_id AND w.active_flag = true)
      ORDER BY 1

  - id: cd02
    category: cross_domain
    persona: ad_sales
    ask: which franchises get the most ad impressions? top 5
    routes: [genie_one, fallback_agent]
    notes: Impressions must be attributed through the episode the ad ran on. A ranking based on the campaign's own series is incorrect.
    gold: |
      SELECT se.franchise_name, COUNT(*) AS impressions
      FROM {sales}.impression_delivery AS i
      JOIN {content}.content_episode AS e ON e.content_episode_id = i.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      JOIN {content}.series AS se ON se.series_id = t.series_id
      GROUP BY se.franchise_name ORDER BY impressions DESC LIMIT 5

  - id: cd03
    category: cross_domain
    persona: ad_ops
    ask: ad impressions by region last quarter
    routes: [genie_one, fallback_agent]
    notes: Last quarter is the last full calendar quarter before the as-of date. Region is the viewer's region.
    gold: |
      SELECT t.territory_group AS region, COUNT(*) AS impressions
      FROM {sales}.impression_delivery AS i
      JOIN {subscriber}.subscriber AS s ON s.subscriber_id = i.subscriber_id
      JOIN {rights}.territory AS t ON t.territory_id = s.territory_id
      WHERE i.delivery_date >= DATE_TRUNC('QUARTER', ADD_MONTHS({today}, -3)) AND i.delivery_date < DATE_TRUNC('QUARTER', {today})
      GROUP BY t.territory_group ORDER BY impressions DESC

  - id: cd04
    category: cross_domain
    persona: licensing
    ask: of our 20 most watched titles ever, how many dont have an active window anywhere?
    routes: [genie_one, fallback_agent]
    gold: |
      WITH top_titles AS (
        SELECT e.title_id, SUM(p.total_watch_duration_seconds) AS seconds
        FROM {distribution}.playback_session AS p
        JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
        GROUP BY e.title_id ORDER BY seconds DESC LIMIT 20
      ),
      active AS (SELECT DISTINCT title_id FROM {rights}.content_window WHERE active_flag = true)
      SELECT COUNT(*) AS top_titles, SUM(CASE WHEN a.title_id IS NULL THEN 1 ELSE 0 END) AS without_active_window
      FROM top_titles AS tt LEFT JOIN active AS a ON a.title_id = tt.title_id

  - id: cd05
    category: cross_domain
    persona: content
    ask: how many watch hours last month came from titles that currently have an active AVOD window?
    routes: [genie_one, fallback_agent]
    gold: |
      WITH avod AS (
        SELECT DISTINCT title_id FROM {rights}.content_window WHERE active_flag = true AND window_type = 'AVOD'
      )
      SELECT ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours, COUNT(DISTINCT e.title_id) AS titles_watched
      FROM {distribution}.playback_session AS p
      JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
      JOIN avod AS a ON a.title_id = e.title_id
      WHERE p.session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
        AND p.session_start_timestamp < DATE_TRUNC('MONTH', {today})

  - id: cd06
    category: cross_domain
    persona: exec
    ask: how does ad revenue compare with subscription revenue last month?
    routes: [genie_one, fallback_agent, "genie:subscribers_revenue"]
    notes: Both figures are required, for the last full calendar month. Ad revenue is small, under 200 dollars; accept within 5 percent. Subscription revenue may be given without tax, with tax or as cash collected if the answer says which; accept about 350 to 385 thousand dollars.
    gold: |
      SELECT
        (SELECT ROUND(SUM(cpm_realized) / 1000.0, 2) FROM {sales}.impression_delivery
          WHERE delivery_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND delivery_date < DATE_TRUNC('MONTH', {today})) AS ad_revenue_usd,
        (SELECT ROUND(SUM(subtotal_amount - discount_amount), 2) FROM {billing}.invoice
          WHERE invoice_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND invoice_date < DATE_TRUNC('MONTH', {today})) AS subscription_revenue_without_tax_usd

  - id: cd07
    category: cross_domain
    persona: ad_ops
    ask: last month, how many ad impressions ran on simulcast titles vs catalogue ones?
    routes: [genie_one, fallback_agent]
    gold: |
      SELECT CASE WHEN t.is_simulcast THEN 'simulcast' ELSE 'catalogue' END AS kind, COUNT(*) AS impressions
      FROM {sales}.impression_delivery AS i
      JOIN {content}.content_episode AS e ON e.content_episode_id = i.content_episode_id
      JOIN {content}.title AS t ON t.title_id = e.title_id
      WHERE i.delivery_date >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND i.delivery_date < DATE_TRUNC('MONTH', {today})
      GROUP BY 1

  - id: cd08
    category: cross_domain
    persona: marketing
    ask: what were people watching right before they cancelled? top 5 titles by name
    routes: [genie_one, fallback_agent]
    notes: The five titles in the trusted result must be named, in any order. Counts within a few of the trusted counts are fine.
    gold: |
      SELECT t.title_id, t.name, COUNT(*) AS cancellations
      FROM {subscriber}.churn_event AS c
      JOIN {content}.title AS t ON t.title_id = c.last_viewed_title_id
      GROUP BY t.title_id, t.name ORDER BY cancellations DESC LIMIT 5

  # ---------------------------------------------------------------- must refuse: outside the agreed scope
