threads:
  - id: th01
    category: curated_subscriber
    persona: exec
    routes: ["genie:subscribers_revenue"]
    turns:
      - ask: how many paying subs do we have?
        gold: |
          SELECT COUNT(DISTINCT s.subscriber_id) AS paying_subscribers
          FROM {subscriber}.subscription AS s
          JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
          WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'
      - ask: and by region?
        gold: |
          SELECT t.territory_group AS region, COUNT(DISTINCT s.subscriber_id) AS paying_subscribers
          FROM {subscriber}.subscription AS s
          JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
          JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = s.subscriber_id
          JOIN {rights}.territory AS t ON t.territory_id = sb.territory_id
          WHERE s.subscription_status = 'Active' AND p.plan_type = 'Paid'
          GROUP BY t.territory_group ORDER BY paying_subscribers DESC
      - ask: which of those lost the most paid subs last month?
        notes: Paid cancellations in the last full calendar month by region. The region with the most must be named.
        gold: |
          SELECT t.territory_group AS region, COUNT(*) AS paid_churns
          FROM {subscriber}.churn_event AS c
          JOIN {subscriber}.subscription AS s ON s.subscription_id = c.subscription_id
          JOIN {subscriber}.subscription_plan AS p ON p.subscription_plan_id = s.subscription_plan_id
          JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = c.subscriber_id
          JOIN {rights}.territory AS t ON t.territory_id = sb.territory_id
          WHERE p.plan_type = 'Paid'
            AND c.churn_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1)) AND c.churn_timestamp < DATE_TRUNC('MONTH', {today})
          GROUP BY t.territory_group ORDER BY paid_churns DESC

  - id: th02
    category: curated_content
    persona: content
    routes: ["genie:content_viewing"]
    turns:
      - ask: top 5 titles by watch hours last month
        gold: |
          SELECT t.title_id, t.name, ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours
          FROM {distribution}.playback_session AS p
          JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
          JOIN {content}.title AS t ON t.title_id = e.title_id
          WHERE p.session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
            AND p.session_start_timestamp < DATE_TRUNC('MONTH', {today})
          GROUP BY t.title_id, t.name ORDER BY SUM(p.total_watch_duration_seconds) DESC LIMIT 5
      - ask: same thing but just LATAM
        gold: |
          SELECT t.title_id, t.name, ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours
          FROM {distribution}.playback_session AS p
          JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
          JOIN {content}.title AS t ON t.title_id = e.title_id
          JOIN {subscriber}.subscriber AS sb ON sb.subscriber_id = p.subscriber_id
          JOIN {rights}.territory AS tr ON tr.territory_id = sb.territory_id
          WHERE tr.territory_group = 'LATAM'
            AND p.session_start_timestamp >= DATE_TRUNC('MONTH', ADD_MONTHS({today}, -1))
            AND p.session_start_timestamp < DATE_TRUNC('MONTH', {today})
          GROUP BY t.title_id, t.name ORDER BY SUM(p.total_watch_duration_seconds) DESC LIMIT 5

  - id: th03
    category: long_tail
    persona: licensing
    routes: [genie_one, fallback_agent]
    turns:
      - ask: how many license agreements expire in the next 90 days?
        notes: Accept one more or one less for the date boundary.
        gold: |
          SELECT COUNT(*) AS expiring_agreements FROM {rights}.license_agreement
          WHERE expiry_date >= {today} AND expiry_date <= {today} + INTERVAL 90 DAYS
      - ask: which licensors are those with? top 3
        notes: The licensor with the most expiring agreements must be named with its count. Several licensors tie below it, so the second and third names may vary.
        gold: |
          SELECT h.rights_holder_name AS licensor, COUNT(*) AS expiring_agreements
          FROM {rights}.license_agreement AS l
          JOIN {rights}.holder AS h ON h.holder_id = l.primary_license_holder_id
          WHERE l.expiry_date >= {today} AND l.expiry_date <= {today} + INTERVAL 90 DAYS
          GROUP BY h.rights_holder_name ORDER BY expiring_agreements DESC LIMIT 3
      - ask: and how much in license fees is tied up in those?
        notes: Total licence fee of all agreements expiring in the next 90 days. Accept within 3 percent. If the answer covers only the top three licensors it must say so.
        gold: |
          SELECT ROUND(SUM(total_license_fee), 0) AS license_fees FROM {rights}.license_agreement
          WHERE expiry_date >= {today} AND expiry_date <= {today} + INTERVAL 90 DAYS

  - id: th04
    category: long_tail
    persona: ad_ops
    routes: [genie_one, fallback_agent]
    turns:
      - ask: avg CPM by campaign objective?
        notes: Realised CPM is about 12 for Awareness, 18 for Consideration, 26 for Conversion and 34 for Brand Launch.
        gold: |
          SELECT c.campaign_type AS objective, ROUND(AVG(i.cpm_realized), 2) AS average_cpm
          FROM {sales}.impression_delivery AS i
          JOIN {sales}.campaign AS c ON c.campaign_id = i.campaign_id
          GROUP BY c.campaign_type ORDER BY average_cpm
      - ask: now delivered impressions for the same breakdown
        gold: |
          SELECT c.campaign_type AS objective, COUNT(*) AS impressions
          FROM {sales}.impression_delivery AS i
          JOIN {sales}.campaign AS c ON c.campaign_id = i.campaign_id
          GROUP BY c.campaign_type ORDER BY impressions DESC

  - id: th05
    category: cross_domain
    persona: licensing
    turns:
      - ask: whats our most watched title of all time?
        routes: ["genie:content_viewing"]
        gold: |
          SELECT t.title_id, t.name, ROUND(SUM(p.total_watch_duration_seconds) / 3600.0, 0) AS watch_hours
          FROM {distribution}.playback_session AS p
          JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
          JOIN {content}.title AS t ON t.title_id = e.title_id
          GROUP BY t.title_id, t.name ORDER BY SUM(p.total_watch_duration_seconds) DESC LIMIT 1
      - ask: do we have an active window for it everywhere people are watching it?
        routes: [genie_one, fallback_agent]
        notes: The answer must say no and single out the countries in the trusted result (codes or full names). Extra detail about later seasons or blacked-out windows is acceptable as long as those two countries are clearly identified.
        gold: |
          SELECT DISTINCT t.name AS country, t.iso_alpha_2_code AS code
          FROM {distribution}.playback_session AS p
          JOIN {content}.content_episode AS e ON e.content_episode_id = p.content_episode_id
          JOIN {subscriber}.subscriber AS s ON s.subscriber_id = p.subscriber_id
          JOIN {rights}.territory AS t ON t.territory_id = s.territory_id
          WHERE e.title_id = 1
            AND NOT EXISTS (
              SELECT 1 FROM {rights}.content_window AS w
              WHERE w.title_id = e.title_id AND w.territory_id = s.territory_id AND w.active_flag = true)
          ORDER BY 1

  - id: th06
    category: must_refuse
    persona: partnerships
    turns:
      - ask: how many partners do we work with, by type?
        category: long_tail
        routes: [genie_one, fallback_agent]
        gold: |
          SELECT partner_type, COUNT(*) AS partners FROM {partner}.partner GROUP BY partner_type ORDER BY partners DESC
      - ask: ok and what do we pay the voice actors on those deals?
        behavior: refuse
