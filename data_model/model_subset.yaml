  - {schema: distribution, table: playback_session, columns: [playback_session_id, subscriber_id, ott_platform_id, content_episode_id, session_start_timestamp, session_end_timestamp, total_watch_duration_seconds, content_duration_seconds, completion_percentage, platform_type, video_resolution, playback_mode, ad_breaks_served_count, audio_language, subtitle_language, exit_reason]}

