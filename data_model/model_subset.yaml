  - {schema: sales, table: ad_order, columns: [ad_order_id, advertiser_id, campaign_id, ott_platform_id, order_number, order_type, order_status, flight_start_date, flight_end_date, currency_code, contracted_cpm, total_contracted_value, net_order_value, payment_terms]}
  - {schema: sales, table: impression_delivery, columns: [impression_delivery_id, campaign_id, content_episode_id, playback_session_id, subscriber_id, delivery_date, delivery_timestamp, insertion_type, ad_pod_position, total_impressions_served, viewable_impressions, completed_views, cpm_realized, revenue_amount, currency_code, verification_status]}

