  - {schema: talent, table: compensation_structure, columns: [compensation_structure_id, contract_id, structure_name, structure_status, compensation_type, base_episode_fee, daily_rate, weekly_guarantee, bonus_amount, deferred_compensation_amount, currency_code, overtime_multiplier, residual_eligibility_flag, effective_start_date]}

# Hoshi Stream specific comments. They replace the generic model text, because every agent in the
# lab (Genie Agents, Genie One, the fallback agent) reads table and column comments.
table_comments:
  subscriber.subscriber: "One row per Hoshi Stream account, free or paying. Region comes from territory_id joined to hoshi_rights.territory (territory_group)."
  subscriber.subscription_plan: "The seven plans: Free (ad-supported), and Fan, Mega Fan and Ultimate Fan, each monthly or annual, with list prices."
  subscriber.subscription: "One row per period a subscriber spent on one plan. A plan change ends one row (Superseded) and starts another. Free plans are included."
  subscriber.churn_event: "One row per cancellation, free or paid. There is exactly one churn event for each subscription row with status Cancelled."
  subscriber.offer: "Promotional offers: free trials, discounts, bundles and win-back offers."
  subscriber.offer_redemption: "One row per use of an offer by a subscriber."
  billing.invoice: "One bill for one billing period of one paid subscription. Free subscriptions have no invoices. Annual plans are invoiced once a year."
  billing.payment: "One payment attempt per invoice, succeeded or failed. Failed payments are not retried."
  billing.refund: "One refund request against one invoice."
  content.genre: "The 25 anime genres."
  content.series: "One row per series, with its franchise name and genre. A franchise can span several series."
  content.season: "One row per season of a series."
  content.title: "One row per title: one per season of a series, plus films and specials. Names repeat, so join on title_id."
  content.content_episode: "One row per episode. A film or special is a single episode of type Feature."
  distribution.ott_platform: "The eight Hoshi Stream platforms: one web and mobile platform and one TV and console platform in each of the four regions."
  distribution.playback_session: "One viewing session by one subscriber of one episode on one platform."
  rights.holder: "One row per rights holder (licensor) that Hoshi Stream licenses content from."
  rights.territory: "One row per country. territory_group is the region: NA, LATAM, EMEA, APAC, or Rights-only for countries with windows but no subscribers."
  rights.license_agreement: "One licence agreement with one licensor, linked to one acquisition deal. An agreement is not linked to specific titles."
  rights.content_window: "One availability window for one title on one platform in one territory. This is the only table that links titles to territories."
  rights.royalty_statement: "One quarterly royalty statement for one licence agreement, with what is owed to the licensor and whether it was paid."
  sales.advertiser: "One row per advertiser buying ads on the free tier."
  sales.campaign: "One ad campaign of one advertiser, with its objective, planned impressions and target CPM."
  sales.ad_order: "One order line under a campaign. Each campaign has two to four order lines that split its planned impressions."
  sales.impression_delivery: "One row per ad impression served during a free-tier viewing session."
  partner.partner: "One row per content partner: studios, distributors, broadcasters and platforms."
  partner.acquisition_deal: "One content acquisition deal with one partner."
  partner.minimum_guarantee: "The minimum guarantee of one acquisition deal, with how much has been recouped and how much is outstanding."
  talent.talent_profile: "Restricted. One row per voice actor or other talent."
  talent.contract: "Restricted. Talent contracts with pay."
  talent.compensation_structure: "Restricted. Detailed pay terms of a talent contract."

column_comments:
  subscriber.subscriber.territory_id: "Country of the subscriber. Join to hoshi_rights.territory; territory_group there is the region (NA, LATAM, EMEA, APAC)."
  subscriber.subscriber.service_tier: "Tier of the subscriber's current plan, or of the last plan if the account is cancelled: Free, Fan, Mega Fan or Ultimate Fan."
  subscriber.subscriber.registration_timestamp: "When the account was created, 1 to 14 days before the first subscription. For sign-up dates use the earliest subscription.activation_date."
  subscriber.subscriber.ltv: "Lifetime value in US dollars: everything the subscriber has paid. Refunds are not subtracted."
  subscriber.subscription_plan.plan_type: "Paid or Free. Use Paid when counting paying subscribers."
  subscriber.subscription_plan.base_price: "List price in US dollars per billing period (month or year). What a subscriber actually pays is subscription.base_rate_amount."
  subscriber.subscription.subscription_status: "Active is the current plan. Cancelled means the subscriber left (churn). Superseded means the row was replaced by a later plan and is not churn."
  subscriber.subscription.subscription_type: "Monthly, Annual or Free."
  subscriber.subscription.activation_date: "Day this plan period started. The earliest activation_date of a subscriber is the sign-up date."
  subscriber.subscription.termination_date: "Day this plan period ended: the churn date for Cancelled rows, the plan change date for Superseded rows. Empty while Active."
  subscriber.subscription.base_rate_amount: "Price in US dollars the subscriber pays per billing period (a month, or a year for annual plans), including regional price changes. For monthly recurring revenue divide annual rows by 12."
  subscriber.churn_event.churn_type: "Voluntary (the subscriber cancelled) or Involuntary (ended after failed payments)."
  subscriber.churn_event.cancellation_reason_code: "Reason for leaving: price, content, competitor, not_using, technical or other."
  billing.invoice.invoice_date: "Day the invoice was issued, which is the first day of its billing period. Use it to place revenue in a month."
  billing.invoice.subtotal_amount: "Amount before tax in US dollars. Revenue without tax is subtotal_amount minus discount_amount."
  billing.invoice.total_amount_due: "Amount billed in US dollars including tax."
  billing.invoice.amount_paid: "Amount collected in US dollars. Zero when the payment failed."
  billing.invoice.invoice_status: "Paid, Overdue (payment failed and the due date has passed) or Open (payment failed, not yet due)."
  billing.payment.amount: "Amount attempted in US dollars, including failed attempts. Filter on payment_status = 'Succeeded' before summing."
  billing.payment.method_type: "Payment method: Credit Card, Debit Card, Direct Debit, PayPal or Gift Card."
  billing.refund.refund_status: "Processed (money returned) or Requested (not yet processed)."
  content.series.franchise_name: "Franchise the series belongs to. One franchise can cover several series."
  content.title.content_type: "Series (one season of a series), Film or Special."
  content.title.is_simulcast: "True when the title streams as a simulcast, one new episode a week shortly after the Japanese broadcast."
  distribution.ott_platform.platform_code: "Code in the form HS-<region>-<WM or TV>, for example HS-LATAM-WM. The middle part is the region."
  distribution.playback_session.total_watch_duration_seconds: "Seconds actually watched in this session. Divide by 3600 for watch hours."
  distribution.playback_session.completion_percentage: "Share of the episode watched in this session, 0 to 100."
  distribution.playback_session.platform_type: "Device used: Smart TV, Console, Mobile, Tablet or Web browser."
  distribution.playback_session.ad_breaks_served_count: "Ad breaks shown in the session. Only free-plan sessions have ads."
  rights.territory.territory_group: "Region: NA, LATAM, EMEA or APAC. Rights-only marks countries where Hoshi Stream holds windows but has no subscribers."
  rights.license_agreement.primary_license_holder_id: "The licensor. Join to hoshi_rights.holder on holder_id for the name."
  rights.license_agreement.agreement_status: "Active or Expired, according to expiry_date."
  rights.license_agreement.expiry_date: "Day the licence ends. Use it for questions about agreements expiring soon."
  rights.license_agreement.territory_scope: "Region the licence covers: Worldwide, NA, LATAM, EMEA or APAC."
  rights.license_agreement.minimum_guarantee_amount: "Minimum guarantee of this licence in US dollars. It is separate from the minimum guarantee of the acquisition deal."
  rights.content_window.active_flag: "True when the window is open now. A title is available in a territory when it has an active window there."
  rights.royalty_statement.statement_status: "Paid, Overdue (late), or Issued and Pending (not yet due)."
  rights.royalty_statement.net_royalty_amount: "Royalty owed to the licensor in US dollars, after withholding tax."
  sales.campaign.campaign_type: "Campaign objective: Awareness, Consideration, Conversion or Brand Launch."
  sales.campaign.target_impressions: "Impressions the advertiser ordered for this campaign. Compare with delivered impressions for the delivery ratio."
  sales.campaign.series_id: "Series the campaign is themed around. It does not show where the ads ran; for that go from impression_delivery to the episode."
  sales.campaign.total_budget_amount: "Planned budget in US dollars (target impressions at target CPM). It is a plan, not spend."
  sales.ad_order.total_contracted_value: "Contracted value of the order line in US dollars. Ordered impressions are total_contracted_value * 1000 / contracted_cpm."
  sales.impression_delivery.total_impressions_served: "Always 1: each row is one impression. Count rows to count delivered impressions."
  sales.impression_delivery.cpm_realized: "Price per thousand impressions for this impression, in US dollars. Average it for CPM. Ad revenue is SUM(cpm_realized) / 1000."
  sales.impression_delivery.revenue_amount: "Revenue of this single impression rounded to the cent. Too coarse for CPM or revenue totals; use cpm_realized."
  partner.minimum_guarantee.mg_status: "Recouped (fully earned back) or Recouping (still outstanding)."
  partner.minimum_guarantee.recouped_to_date_amount: "US dollars of the guarantee earned back so far. Share recouped is recouped_to_date_amount / mg_amount."
  partner.minimum_guarantee.outstanding_balance_amount: "US dollars of the guarantee not yet earned back."
  partner.minimum_guarantee.recoupment_percentage: "Contract term, always 100. It is not the share recouped so far."
