  - {schema: rights, table: territory, columns: [territory_id, code, name, iso_alpha_2_code, iso_alpha_3_code, territory_group, territory_type, currency_code, language_primary, time_zone, population]}
  - {schema: rights, table: license_agreement, columns: [license_agreement_id, primary_license_holder_id, acquisition_deal_id, agreement_number, agreement_type, agreement_status, effective_date, expiry_date, signed_date, territory_scope, exclusivity_flag, minimum_guarantee_amount, total_license_fee, royalty_percentage, currency_code, windowing_strategy]}
  - {schema: rights, table: content_window, columns: [content_window_id, title_id, ott_platform_id, territory_id, window_type, window_open_date, window_close_date, availability_status, active_flag, exclusivity_tier, license_fee_amount, license_fee_currency, blackout_flag, window_priority]}
  - {schema: rights, table: royalty_statement, columns: [royalty_statement_id, holder_id, license_agreement_id, statement_number, statement_frequency, statement_period_start_date, statement_period_end_date, statement_due_date, statement_issue_date, statement_status, currency_code, gross_royalty_amount, net_royalty_amount, withholding_tax_amount, paid_timestamp]}

  - {schema: sales, table: advertiser, columns: [advertiser_id, legal_name, trade_name, industry_category, account_status, annual_spend_tier, credit_status, contract_start_date, contract_end_date, is_political_advertiser, payment_terms, preferred_currency_code, billing_country_code]}
