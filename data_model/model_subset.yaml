# Subset of the media_broadcasting v2 MVM model used by the Hoshi Stream lab.
# Names are verified against model.json at the pinned SHA by build_ddl.py.
# model.json (Databricks License) is NOT vendored here: build_ddl.py fetches it at build time.
source:
  repo: databricks-industry-solutions/lakehouse-industry-data-models
  path: data-models/media_broadcasting/v2/mvm/model.json
  sha: b0e09a57ef309494d85f87d2bf2e4dfbb374a071

# Columns that the model does not contain but the lab stories need.
# Each entry is schema.table.column; build_ddl.py creates them, generate.py fills them.
extensions:
  content.title.is_simulcast:
    type: BOOLEAN
    comment: "Hoshi Stream extension: title is streamed simulcast, one episode per week shortly after the Japanese broadcast."
  distribution.playback_session.content_episode_id:
    type: BIGINT
    references: content.content_episode.content_episode_id
    comment: "Hoshi Stream extension: the episode watched in this session. The MVM playback_session has no content key."
  distribution.playback_session.audio_language:
    type: STRING
    comment: "Hoshi Stream extension: language of the audio track played (for example Japanese, English, Spanish, Portuguese)."
  distribution.playback_session.subtitle_language:
    type: STRING
    comment: "Hoshi Stream extension: subtitle language shown during the session, NULL when no subtitles were on."
  rights.content_window.title_id:
    type: BIGINT
    references: content.title.title_id
    comment: "Hoshi Stream extension: title the availability window covers. The MVM content_window has no title key."

# Scope rules: the tag value goes on hoshi_<schema> as agent_scope.
schemas:
  subscriber: curated
  billing: curated
  content: curated
  distribution: curated
  rights: fallback
  sales: fallback
  partner: fallback
  talent: off_limits
  lab: lab

tables:
  - {schema: subscriber, table: subscriber, columns: [subscriber_id, territory_id, country_code, preferred_language, account_status, service_tier, registration_source, registration_timestamp, billing_cycle, marketing_opt_in, total_viewing_hours, ltv, arpu, last_viewing_timestamp]}
  - {schema: subscriber, table: subscription_plan, columns: [subscription_plan_id, plan_code, plan_name, plan_type, service_tier, base_price, currency_code, ad_supported, contract_term_months, trial_duration_days, plan_status, launch_date]}
  - {schema: subscriber, table: subscription, columns: [subscription_id, subscriber_id, subscription_plan_id, subscription_number, subscription_status, subscription_type, activation_date, current_term_start_date, current_term_end_date, termination_date, base_rate_amount, currency_code, auto_renew_flag, promotional_rate_flag, acquisition_channel]}
  - {schema: subscriber, table: churn_event, columns: [churn_event_id, subscriber_id, subscription_id, last_viewed_title_id, ott_platform_id, churn_timestamp, churn_type, cancellation_reason_code, cancellation_reason_description, subscription_tenure_months, days_since_last_viewing, payment_failure_count, total_lifetime_revenue, service_tier]}
  - {schema: subscriber, table: offer, columns: [offer_id, ott_platform_id, code, name, offer_type, offer_status, discount_percentage, discount_amount, price_amount, effective_start_date, effective_end_date, trial_duration_days]}
  - {schema: subscriber, table: offer_redemption, columns: [offer_redemption_id, offer_id, subscriber_id, subscription_id, resulting_subscription_plan_id, redemption_timestamp, redemption_channel, redemption_status, discount_type, applied_discount_amount, discount_duration_months, first_time_subscriber_flag, revenue_impact_amount]}

  - {schema: billing, table: invoice, columns: [invoice_id, subscriber_id, subscription_plan_id, invoice_number, invoice_date, billing_period_start_date, billing_period_end_date, due_date, paid_date, invoice_status, currency_code, subtotal_amount, discount_amount, tax_amount, total_amount_due, amount_paid]}
  - {schema: billing, table: payment, columns: [payment_id, invoice_id, payment_number, payment_date, payment_timestamp, payment_status, method_type, gateway, failure_reason, is_autopay, amount, currency_code, refund_amount]}
  - {schema: billing, table: refund, columns: [refund_id, payment_id, invoice_id, subscriber_id, refund_number, request_date, processing_date, refund_status, refund_type, reason_code, reason_description, amount, currency_code]}

  - {schema: content, table: genre, columns: [genre_id, code, name, description, target_demographic, tier, is_active, parental_guidance_flag, daypart_affinity, syndication_eligibility, effective_start_date, usage_notes]}
  - {schema: content, table: series, columns: [series_id, genre_id, franchise_name, title, series_type, series_status, premiere_date, finale_date, total_season_count, total_episode_count, original_network, production_company, language_original, country_of_origin]}
  - {schema: content, table: season, columns: [season_id, series_id, season_number, season_status, original_air_date, finale_date, episode_count_ordered, episode_count_aired, production_year, network_original, language_original]}
  - {schema: content, table: title, columns: [title_id, series_id, genre_id, name, content_type, production_year, release_date, runtime_seconds, original_language, content_status, parental_advisory_flag, premiere_flag, season_number, country_of_origin, is_simulcast]}
  - {schema: content, table: content_episode, columns: [content_episode_id, title_id, content_season_id, content_series_id, episode_number, title, runtime_seconds, original_air_date, vod_available_from_date, vod_available_until_date, episode_type, episode_status, subtitles_available, video_resolution]}

