[project]
name = "hoshi-fallback-agent"
version = "0.1.0"
description = "Governed text-to-SQL fallback agent: context files, SQL allowlist guard, Unity Gateway for LLM and SQL"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "databricks-openai==0.18.0",
    "databricks-agents==1.13.0",
    "databricks-sdk==0.165.0",
    "mlflow==3.18.0",
    "openai-agents==0.20.0",
    "fastmcp==3.4.11",
    "sqlglot==30.30.0",
    "pyyaml==6.0.3",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
start-server = "agent_server.start_server:main"

[tool.ruff]
line-length = 120
extend-exclude = ["scripts/app_diagnostics.py", "agent_server/history.py"]  # copied from databricks/app-templates
