[project]
name = "hoshi-lab-app"
version = "0.1.0"
description = "Web UI for the supervisor fallback evaluation lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "databricks-sdk==0.165.0",
    "requests==2.34.2",
    "sqlglot==30.30.0",
    "pyyaml==6.0.3",
]

[project.scripts]
start-app = "lab_app.main:run"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_app", "labcore"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
