[project]
name = "supervisor-fallback-lab"
version = "0.1.0"
description = "Lab scripts: data model, Genie Agents, Genie One scope, supervisors and evaluation"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk==0.165.0",
    "mlflow==3.18.0",
    "databricks-agents==1.13.0",
    "openai==3.46.0",
    "pandas==3.1.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "sqlglot==30.30.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120
extend-exclude = [".vendor", "custom_agent", "app", "spikes"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "app/backend", "eval"]
testpaths = ["eval/tests"]
